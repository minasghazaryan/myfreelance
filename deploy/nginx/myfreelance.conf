# OPTIONAL — use later when you have a domain.
# For now, access the app directly at http://<VPS_IP>:8082 (see deploy/.env MYFREELANCE_HOST_PORT).
#
# Add to the EXISTING nginx container without changing kinohub.org:
#   docker cp deploy/nginx/myfreelance.conf <nginx-container>:/etc/nginx/conf.d/myfreelance.conf
#   docker exec <nginx-container> nginx -t && docker exec <nginx-container> nginx -s reload
#
# If your nginx.conf does not already define this map inside http { }, add it once:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

upstream myfreelance_app {
    server myfreelance-web:8080;
    keepalive 32;
}

# --- Domain + HTTPS (when ready) ---

server {
    listen 80;
    server_name myfreelance.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name myfreelance.example.com;

    ssl_certificate     /etc/letsencrypt/live/myfreelance.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myfreelance.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    location / {
        proxy_pass http://myfreelance_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
